<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>STREAMKU</title><style>
:root{--bg:#141414;--fg:#fff;--mut:#b3b3b3;--red:#e50914;--card:#2a2a2a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;align-items:center;gap:20px;padding:14px 4%;background:linear-gradient(#000c,transparent);transition:background .3s}
nav.solid{background:var(--bg)}
.logo{color:var(--red);font-weight:900;font-size:26px;letter-spacing:1px;cursor:pointer}
nav a{color:#e5e5e5;font-size:14px;cursor:pointer}
nav a:hover{color:var(--mut)}
.sp{flex:1}
#q{background:#000a;border:1px solid #fff8;color:#fff;padding:6px 10px;font-size:14px;width:0;opacity:0;transition:.3s;border-radius:2px}
#q.on{width:160px;opacity:1}
.ib{background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
.add{background:var(--red);border:0;color:#fff;padding:8px 14px;border-radius:4px;font-weight:700;cursor:pointer;font-size:14px}
.hero{position:relative;height:80vh;min-height:420px;display:flex;align-items:flex-end;padding:0 4% 12vh;background:#222 center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000b 0,transparent 60%),linear-gradient(transparent 55%,var(--bg))}
.hero>div{position:relative;z-index:1;max-width:520px}
.hero h1{font-size:clamp(28px,5vw,60px);font-weight:900;text-shadow:2px 2px 8px #000a}
.hero p{margin:12px 0 18px;font-size:clamp(14px,1.5vw,19px);color:#ddd}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:4px;padding:10px 24px;font-size:17px;font-weight:700;cursor:pointer;margin-right:10px}
.btn.w{background:#fff;color:#000}.btn.g{background:#6d6d6eb3;color:#fff}
.btn:hover{opacity:.8}
.rows{position:relative;z-index:2;margin-top:-9vh;padding-bottom:60px}
.row{margin-bottom:28px;position:relative}
.row h2{font-size:20px;padding:0 4%;margin-bottom:8px}
.sc{display:flex;gap:6px;overflow-x:auto;padding:30px 4%;scroll-behavior:smooth;scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
.arr{position:absolute;top:36px;bottom:30px;width:4%;border:0;background:#000a;color:#fff;font-size:28px;cursor:pointer;z-index:3;opacity:0;transition:.2s}
.row:hover .arr{opacity:1}.arr.l{left:0}.arr.r{right:0}
.card{flex:0 0 auto;width:clamp(150px,18vw,260px);aspect-ratio:16/9;border-radius:4px;background:var(--card) center/cover;position:relative;cursor:pointer;transition:transform .25s,box-shadow .25s;overflow:hidden}
.card:hover{transform:scale(1.35);z-index:5;box-shadow:0 8px 24px #000}
.card .t{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:12px;font-weight:700;background:linear-gradient(transparent,#000d)}
.card .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;font-weight:700;background:linear-gradient(135deg,#3a1c71,#b21f1f)}
.acts{position:absolute;top:4px;right:4px;display:none;gap:4px}
.card:hover .acts{display:flex}
.acts button{width:26px;height:26px;border-radius:50%;border:1px solid #fff8;background:#000b;color:#fff;cursor:pointer;font-size:12px}
.empty{text-align:center;padding:30vh 6% 10vh}
.empty h1{font-size:32px;margin-bottom:10px}.empty p{color:var(--mut);margin-bottom:22px}
.modal{position:fixed;inset:0;background:#000e;z-index:50;display:none;align-items:center;justify-content:center}
.modal.on{display:flex}
.modal video{width:100%;height:100%;background:#000}
.x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px;z-index:2;background:#000a;border:0;color:#fff;font-size:26px;width:42px;height:42px;border-radius:50%;cursor:pointer}
.ptitle{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:20px;z-index:2;font-weight:700;text-shadow:0 0 6px #000}
.dz{border:2px dashed #666;border-radius:8px;padding:50px 20px;text-align:center;cursor:pointer;background:#181818;max-width:440px;width:90%}
.dz.o{border-color:var(--red)}
.box{background:#181818;border-radius:8px;padding:28px;max-width:520px;width:92%}
.box h3{font-size:22px;margin-bottom:6px}.box p{color:var(--mut);font-size:14px;margin-bottom:14px}
.prog{margin-top:14px;font-size:13px;color:var(--mut)}
footer{text-align:center;color:#777;font-size:12px;padding:30px}
.hero .meta{color:#46d369;font-weight:700;font-size:14px}
.frame{position:fixed;inset:0;z-index:40;background:#000c;display:none;align-items:center;justify-content:center;overflow:auto;padding:20px}
.frame.on{display:flex}
.fbox{position:relative;width:min(860px,100%);background:#181818;border-radius:10px;overflow:hidden;box-shadow:0 10px 50px #000}
.fpic{height:min(46vw,420px);min-height:200px;background:#333 center/cover;position:relative;display:flex;align-items:center;justify-content:center}
.fpic::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#181818)}
.big{position:relative;z-index:1;width:84px;height:84px;border-radius:50%;border:3px solid #fff;background:#000a;color:#fff;font-size:34px;cursor:pointer}
.big:hover{background:var(--red);border-color:var(--red)}
.fin{padding:6px 28px 28px}
.fin h2{font-size:28px;margin-bottom:8px}
.fin .meta{color:#46d369;font-weight:700;font-size:14px;margin-bottom:12px}
.fin p{color:#ccc;line-height:1.5;margin-bottom:16px}
.fx{position:absolute;top:10px;right:10px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:#181818;color:#fff;font-size:18px;cursor:pointer}
.admin{padding:100px 4% 60px;max-width:900px;margin:auto}
.admin h1{margin-bottom:6px}.admin .sub{color:var(--mut);margin-bottom:22px;font-size:14px}
.pn{background:#1f1f1f;border-radius:8px;padding:20px;margin-bottom:24px}
.pn label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.pn input,.pn textarea{width:100%;background:#333;border:1px solid #555;color:#fff;border-radius:4px;padding:9px;font:inherit}
.pn textarea{min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #333}
.li img,.li .nb{width:96px;aspect-ratio:16/9;object-fit:cover;background:#333;border-radius:3px}
.li b{flex:1;font-size:14px}
.sm{background:#333;border:0;color:#fff;padding:6px 10px;border-radius:4px;cursor:pointer}
.sm.d{background:#7a1016}
.msg{margin-top:12px;font-size:14px}.err{color:#ff6b6b}

/* ===== Animasi ===== */
body{animation:fadeIn .9s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.row{opacity:0;transform:translateY(34px);transition:opacity .7s ease,transform .7s ease}
.row.in{opacity:1;transform:none}
.row.in .card{animation:cardIn .55s backwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes cardIn{from{opacity:0;transform:translateX(24px) scale(.94)}to{opacity:1;transform:none}}
.card:hover~.card{transform:translateX(16%)}
.card:has(~.card:hover){transform:translateX(-16%)}
.hero{overflow:hidden}
.hero>.hbg{position:absolute;inset:0;max-width:none;z-index:0;background:#222 center/cover no-repeat;animation:kb 22s ease-in-out infinite alternate;will-change:transform}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
.hcon>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
.hcon>:nth-child(1){animation-delay:.25s}.hcon>:nth-child(2){animation-delay:.45s}.hcon>:nth-child(3){animation-delay:.65s}.hcon>:nth-child(4){animation-delay:.85s}.hcon>:nth-child(5){animation-delay:.95s}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.frame.on .fbox{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.row{opacity:1;transform:none}}
</style></head><body>
<nav id="nav"><div class="logo" onclick="setF('all')">STREAMKU</div><a onclick="setF('all')">Beranda</a><a onclick="setF('fav')">Daftar Saya</a><div class="sp"></div>
<input id="q" placeholder="Cari judul…" oninput="render()"><button class="ib" onclick="tq()" aria-label="Cari">🔍</button></nav>
<div id="app"></div><footer>STREAMKU</footer>
<div class="frame" id="fr" onclick="if(event.target===this)closeFr()"><div class="fbox"><button class="fx" onclick="closeFr()" aria-label="Tutup">✕</button>
<div class="fpic" id="fpic"><button class="big" onclick="startFilm()" aria-label="Mulai film">▶</button></div>
<div class="fin"><h2 id="ft"></h2><div class="meta" id="fm"></div><p id="fd"></p><button class="btn w" onclick="startFilm()">▶ Mulai Film</button><button class="btn g" id="fb" onclick="favCur()"></button></div></div></div>
<div class="modal" id="playM"><button class="x" onclick="closeP()" aria-label="Tutup">✕</button><div class="ptitle" id="pt"></div><video id="vid" controls playsinline></video><iframe id="ifr" allow="autoplay; fullscreen" allowfullscreen style="width:100%;height:100%;border:0;display:none;background:#000"></iframe></div>
<script>
let movies=[],filter='all',curId=null,ready=false,dbErr='';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>{if(!d||!isFinite(d))return'';const h=Math.floor(d/3600),m=Math.round(d%3600/60);return h?`${h}j ${m}m`:`${m} menit`};

let favs=[];try{favs=JSON.parse(localStorage.getItem('sk_favs')||'[]')}catch(e){}
const isFav=id=>favs.includes(id),isAdmin=()=>false;
function saveFavs(){try{localStorage.setItem('sk_favs',JSON.stringify(favs))}catch(e){}}
let lastJ='';
async function load(){const r=await fetch('movies.json',{cache:'no-cache'});if(!r.ok)throw 0;const x=await r.text();if(x===lastJ)return false;const j=JSON.parse(x);
  movies=j.map(m=>{const o={...m};
   if(m.src==='drive'){o.embed='https://drive.google.com/file/d/'+m.ref+'/preview';o.poster=m.poster||'https://drive.google.com/thumbnail?id='+m.ref+'&sz=w800'}
   else if(m.src==='archive'){if(m.file)o.video='https://archive.org/download/'+m.ref+'/'+encodeURIComponent(m.file);else o.embed='https://archive.org/embed/'+m.ref;o.poster=m.poster||'https://archive.org/services/img/'+m.ref}
   return o}).sort((a,b)=>(b.added||0)-(a.added||0));lastJ=x;return true}
async function init(){try{await load()}catch(e){dbErr='Gagal memuat movies.json.'}ready=true;render()}
/* Cek katalog baru tiap 3 menit, diam-diam. Ditunda jika ada film/jendela detail yang sedang terbuka. */
async function poll(){if(document.hidden||$('playM').classList.contains('on')||$('fr').classList.contains('on'))return;
 try{if(await load()){dbErr='';render()}}catch(e){}}
setInterval(poll,180000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
/* ---------- viewer ---------- */
function card(m){return `<div class="card" style="${m.poster?`background-image:url(${esc(m.poster)})`:''}" onclick="openFr('${m.id}')">${m.poster?'':`<div class="ph">${esc(m.title)}</div>`}<div class="t">${esc(m.title)}</div></div>`}
function row(t,l){return l.length?`<div class="row"><h2>${esc(t)}</h2><button class="arr l" onclick="sc(this,-1)">‹</button><div class="sc">${l.map(card).join('')}</div><button class="arr r" onclick="sc(this,1)">›</button></div>`:''}
function sc(b,d){const s=b.parentNode.querySelector('.sc');s.scrollBy({left:d*s.clientWidth*.85})}
function render(){
 
 const q=$('q').value.toLowerCase().trim();
 if(!ready){$('app').innerHTML='<div class="empty"><p>Memuat katalog…</p></div>';return}
 if(dbErr){$('app').innerHTML=`<div class="empty"><h1>Oops</h1><p>${esc(dbErr)}</p></div>`;return}
 if(!movies.length){$('app').innerHTML=`<div class="empty"><h1>Belum ada film</h1><p>Katalog masih kosong.</p>${isAdmin()?'<button class="btn w" onclick="location.hash=\'admin\'">⚙ Buka Panel Admin</button>':''}</div>`;return}
 const l=movies.filter(m=>(!q||m.title.toLowerCase().includes(q))&&(filter!=='fav'||isFav(m.id)));
 const h=l[0];let html='';
 if(h&&!q&&filter==='all')html+=`<div class="hero"><div class="hbg" style="${h.poster?`background-image:url(${esc(h.poster)})`:''}"></div><div class="hcon"><h1>${esc(h.title)}</h1><div class="meta">${[h.year,h.genre,fmt(h.dur)].filter(Boolean).map(esc).join(' · ')}</div><p>${esc(h.synopsis||'')}</p><button class="btn w" onclick="openFr('${h.id}')">▶ Putar</button><button class="btn g" onclick="openFr('${h.id}')">ⓘ Info</button></div></div>`;
 else html+='<div style="height:90px"></div>';
 html+=`<div class="rows" ${(filter!=='all'||q||!h)?'style="margin-top:0"':''}>`;
 if(!l.length)html+='<div class="empty" style="padding-top:10vh"><p>Tidak ada hasil.</p></div>';
 else{html+=row(filter==='fav'?'Daftar Saya':q?'Hasil Pencarian':'Baru Ditambahkan',l);
  if(filter==='all'&&!q){html+=row('Daftar Saya',l.filter(m=>isFav(m.id)));
   const g={};l.forEach(m=>{if(m.genre)(g[m.genre]=g[m.genre]||[]).push(m)});Object.keys(g).forEach(k=>html+=row(k,g[k]))}}
 $('app').innerHTML=html+'</div>';reveal()}
let io;
function reveal(){const rows=[...document.querySelectorAll('.row')];rows.forEach(r=>r.querySelectorAll('.card').forEach((c,i)=>c.style.setProperty('--i',Math.min(i,10))));
 if(io)io.disconnect();if(!('IntersectionObserver' in window)){rows.forEach(r=>r.classList.add('in'));return}
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});rows.forEach(r=>io.observe(r))}
function setF(f){filter=f;render();scrollTo(0,0)}
function tq(){const q=$('q');q.classList.toggle('on');if(q.classList.contains('on'))q.focus();else{q.value='';render()}}

/* ---------- frame mulai film ---------- */
function openFr(id){const m=movies.find(x=>x.id===id);if(!m)return;curId=id;
 $('fpic').style.backgroundImage=m.poster?`url(${m.poster})`:'';
 $('ft').textContent=m.title;$('fm').textContent=[m.year,m.genre,fmt(m.dur)].filter(Boolean).join(' · ');
 $('fd').textContent=m.synopsis||'Tidak ada sinopsis.';$('fb').textContent=isFav(id)?'✓ Di Daftar Saya':'+ Daftar Saya';
 $('fr').classList.add('on')}
function closeFr(){$('fr').classList.remove('on')}
function favCur(){favs=isFav(curId)?favs.filter(x=>x!==curId):[...favs,curId];saveFavs();$('fb').textContent=isFav(curId)?'✓ Di Daftar Saya':'+ Daftar Saya';render()}
function startFilm(){const m=movies.find(x=>x.id===curId);if(!m)return;closeFr();$('pt').textContent=m.title;const f=$('ifr'),v=$('vid');
 if(m.embed){v.style.display='none';f.style.display='block';f.src=m.embed}else{f.style.display='none';v.style.display='block';v.src=m.video;v.play().catch(()=>{})}
 $('playM').classList.add('on')}
function closeP(){const v=$('vid');v.pause();v.removeAttribute('src');v.load();$('ifr').src='about:blank';$('playM').classList.remove('on')}


addEventListener('scroll',()=>$('nav').classList.toggle('solid',scrollY>40));
addEventListener('keydown',e=>{if(e.key==='Escape'){closeP();closeFr()}});
init();
</script></body></html>
