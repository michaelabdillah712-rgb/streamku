<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Admin STREAMKU</title><style>
:root{--bg:#141414;--fg:#fff;--mut:#b3b3b3;--red:#e50914;--card:#2a2a2a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;align-items:center;gap:20px;padding:14px 4%;background:linear-gradient(#000c,transparent);transition:background .3s}
nav.solid{background:var(--bg)}
.logo{color:var(--red);font-weight:900;font-size:26px;letter-spacing:1px;cursor:pointer}
nav a{color:#e5e5e5;font-size:14px;cursor:pointer}
nav a:hover{color:var(--mut)}
.sp{flex:1}
#q{background:#000a;border:1px solid #fff8;color:#fff;padding:6px 10px;font-size:14px;width:0;opacity:0;transition:.3s;border-radius:2px}
#q.on{width:160px;opacity:1}
.ib{background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
.add{background:var(--red);border:0;color:#fff;padding:8px 14px;border-radius:4px;font-weight:700;cursor:pointer;font-size:14px}
.hero{position:relative;height:80vh;min-height:420px;display:flex;align-items:flex-end;padding:0 4% 12vh;background:#222 center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000b 0,transparent 60%),linear-gradient(transparent 55%,var(--bg))}
.hero>div{position:relative;z-index:1;max-width:520px}
.hero h1{font-size:clamp(28px,5vw,60px);font-weight:900;text-shadow:2px 2px 8px #000a}
.hero p{margin:12px 0 18px;font-size:clamp(14px,1.5vw,19px);color:#ddd}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:4px;padding:10px 24px;font-size:17px;font-weight:700;cursor:pointer;margin-right:10px}
.btn.w{background:#fff;color:#000}.btn.g{background:#6d6d6eb3;color:#fff}
.btn:hover{opacity:.8}
.rows{position:relative;z-index:2;margin-top:-9vh;padding-bottom:60px}
.row{margin-bottom:28px;position:relative}
.row h2{font-size:20px;padding:0 4%;margin-bottom:8px}
.sc{display:flex;gap:6px;overflow-x:auto;padding:30px 4%;scroll-behavior:smooth;scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
.arr{position:absolute;top:36px;bottom:30px;width:4%;border:0;background:#000a;color:#fff;font-size:28px;cursor:pointer;z-index:3;opacity:0;transition:.2s}
.row:hover .arr{opacity:1}.arr.l{left:0}.arr.r{right:0}
.card{flex:0 0 auto;width:clamp(150px,18vw,260px);aspect-ratio:16/9;border-radius:4px;background:var(--card) center/cover;position:relative;cursor:pointer;transition:transform .25s,box-shadow .25s;overflow:hidden}
.card:hover{transform:scale(1.35);z-index:5;box-shadow:0 8px 24px #000}
.card .t{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:12px;font-weight:700;background:linear-gradient(transparent,#000d)}
.card .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;font-weight:700;background:linear-gradient(135deg,#3a1c71,#b21f1f)}
.acts{position:absolute;top:4px;right:4px;display:none;gap:4px}
.card:hover .acts{display:flex}
.acts button{width:26px;height:26px;border-radius:50%;border:1px solid #fff8;background:#000b;color:#fff;cursor:pointer;font-size:12px}
.empty{text-align:center;padding:30vh 6% 10vh}
.empty h1{font-size:32px;margin-bottom:10px}.empty p{color:var(--mut);margin-bottom:22px}
.modal{position:fixed;inset:0;background:#000e;z-index:50;display:none;align-items:center;justify-content:center}
.modal.on{display:flex}
.modal video{width:100%;height:100%;background:#000}
.x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px;z-index:2;background:#000a;border:0;color:#fff;font-size:26px;width:42px;height:42px;border-radius:50%;cursor:pointer}
.ptitle{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:20px;z-index:2;font-weight:700;text-shadow:0 0 6px #000}
.dz{border:2px dashed #666;border-radius:8px;padding:50px 20px;text-align:center;cursor:pointer;background:#181818;max-width:440px;width:90%}
.dz.o{border-color:var(--red)}
.box{background:#181818;border-radius:8px;padding:28px;max-width:520px;width:92%}
.box h3{font-size:22px;margin-bottom:6px}.box p{color:var(--mut);font-size:14px;margin-bottom:14px}
.prog{margin-top:14px;font-size:13px;color:var(--mut)}
footer{text-align:center;color:#777;font-size:12px;padding:30px}
.hero .meta{color:#46d369;font-weight:700;font-size:14px}
.frame{position:fixed;inset:0;z-index:40;background:#000c;display:none;align-items:center;justify-content:center;overflow:auto;padding:20px}
.frame.on{display:flex}
.fbox{position:relative;width:min(860px,100%);background:#181818;border-radius:10px;overflow:hidden;box-shadow:0 10px 50px #000}
.fpic{height:min(46vw,420px);min-height:200px;background:#333 center/cover;position:relative;display:flex;align-items:center;justify-content:center}
.fpic::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#181818)}
.big{position:relative;z-index:1;width:84px;height:84px;border-radius:50%;border:3px solid #fff;background:#000a;color:#fff;font-size:34px;cursor:pointer}
.big:hover{background:var(--red);border-color:var(--red)}
.fin{padding:6px 28px 28px}
.fin h2{font-size:28px;margin-bottom:8px}
.fin .meta{color:#46d369;font-weight:700;font-size:14px;margin-bottom:12px}
.fin p{color:#ccc;line-height:1.5;margin-bottom:16px}
.fx{position:absolute;top:10px;right:10px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:#181818;color:#fff;font-size:18px;cursor:pointer}
.admin{padding:100px 4% 60px;max-width:900px;margin:auto}
.admin h1{margin-bottom:6px}.admin .sub{color:var(--mut);margin-bottom:22px;font-size:14px}
.pn{background:#1f1f1f;border-radius:8px;padding:20px;margin-bottom:24px}
.pn label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.pn input,.pn textarea{width:100%;background:#333;border:1px solid #555;color:#fff;border-radius:4px;padding:9px;font:inherit}
.pn textarea{min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #333}
.li img,.li .nb{width:96px;aspect-ratio:16/9;object-fit:cover;background:#333;border-radius:3px}
.li b{flex:1;font-size:14px}
.sm{background:#333;border:0;color:#fff;padding:6px 10px;border-radius:4px;cursor:pointer}
.sm.d{background:#7a1016}
.msg{margin-top:12px;font-size:14px}.err{color:#ff6b6b}
</style><style>.admin{padding-top:30px}.pn select{width:100%;background:#333;border:1px solid #555;color:#fff;border-radius:4px;padding:9px}</style></head><body>
<div class="admin"><h1>Admin Katalog</h1><div class="sub">Alat pembuat <code>movies.json</code>. Tempel link dari Google Drive atau Internet Archive, isi data, lalu salin hasilnya.</div>
<div class="pn"><b>Tambah Film</b>
<label>Link film (Google Drive “Siapa saja yang memiliki link” atau halaman archive.org) *</label><input id="al" placeholder="https://drive.google.com/file/d/…/view  atau  https://archive.org/details/…">
<label>Nama file video di Archive (opsional; isi jika ingin pemutar sendiri, mis. film.mp4)</label><input id="af">
<label>Judul *</label><input id="at"><label>Sinopsis</label><textarea id="as"></textarea>
<div class="g2"><div><label>Genre</label><input id="ag" placeholder="Aksi, Drama…"></div><div><label>Tahun</label><input id="ay" type="number"></div></div>
<div class="g2"><div><label>Durasi (menit)</label><input id="ad" type="number"></div><div><label>URL poster (opsional)</label><input id="ap" placeholder="otomatis jika kosong"></div></div>
<div style="margin-top:16px"><button class="btn w" onclick="add()">Tambah ke daftar</button></div><div class="msg" id="am"></div></div>
<div class="pn"><b>Daftar &amp; Hasil</b><div id="ls"></div>
<label>Isi movies.json (salin lalu tempel ke GitHub)</label><textarea id="out" readonly style="min-height:160px;font-family:monospace;font-size:12px"></textarea>
<div style="margin-top:12px"><button class="btn w" onclick="cp()">📋 Salin</button><button class="btn g" onclick="dl()">⬇ Unduh</button></div></div></div>
<script>
let list=[];const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg=(t,e)=>{const m=$('am');m.textContent=t;m.className='msg'+(e?' err':'')};
function draw(){$('ls').innerHTML=list.map((m,i)=>`<div class="li"><b>${esc(m.title)} <small style="color:#888">${esc(m.src)}</small></b><button class="sm d" onclick="list.splice(${i},1);draw()">Hapus</button></div>`).join('')||'<p class="sub">Kosong.</p>';$('out').value=JSON.stringify(list,null,2)}
function add(){const l=$('al').value.trim(),t=$('at').value.trim();if(!l||!t)return msg('Isi link dan judul.',1);
 let src,ref,file=$('af').value.trim();
 if(/drive\.google|docs\.google/.test(l)){src='drive';const m=l.match(/\/d\/([\w-]+)/)||l.match(/[?&]id=([\w-]+)/);if(!m)return msg('ID Drive tidak ditemukan di link.',1);ref=m[1]}
 else if(/archive\.org/.test(l)){src='archive';const m=l.match(/(?:details|embed|download)\/([^/?#]+)(?:\/([^?#]+))?/);if(!m)return msg('ID Archive tidak ditemukan di link.',1);ref=m[1];if(!file&&m[2])file=decodeURIComponent(m[2])}
 else return msg('Link harus dari Google Drive atau archive.org.',1);
 const o={id:'m'+Date.now().toString(36),title:t,synopsis:$('as').value.trim(),genre:$('ag').value.trim(),year:$('ay').value.trim(),dur:Math.round(($('ad').value||0)*60),src,ref,added:Date.now()};
 if(file&&src==='archive')o.file=file;if($('ap').value.trim())o.poster=$('ap').value.trim();
 list.unshift(o);draw();['al','af','at','as','ag','ay','ad','ap'].forEach(i=>$(i).value='');msg('Ditambahkan. Salin hasil di bawah ke movies.json.')}
async function cp(){try{await navigator.clipboard.writeText($('out').value);alert('Tersalin')}catch(e){$('out').select();alert('Tahan layar lalu pilih Salin')}}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('out').value],{type:'application/json'}));a.download='movies.json';a.click()}
fetch('movies.json').then(r=>r.json()).then(j=>{list=j;draw()}).catch(draw);
</script></body></html>
